name: CI

# The unit tests run without network access or browsers; the integration tests need both and
# would make every push depend on downloading several hundred megabytes of browser engines.
# They are excluded here and run nightly instead.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, for the integration tests below.
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  unit:
    name: Build and unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # -warnaserror keeps the project's warning-free state from eroding.
      - run: dotnet build --no-restore -c Release -warnaserror
      - run: dotnet test --no-build -c Release --filter "Category!=Integration"

  locale:
    name: Unit tests under an English locale
    runs-on: ubuntu-latest
    # A test that depended on the machine's language slipped through once; this keeps that shut.
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test --filter "Category!=Integration"

  publish:
    name: Single-file publish for ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: osx-arm64
            runner: macos-latest
          - rid: osx-x64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Verifies that the publish path documented in CLAUDE.md still produces one file.
      - run: dotnet publish LumenHut/LumenHut.csproj -c Release -r ${{ matrix.rid }} -p:PublishSingleFile=true -o dist/${{ matrix.rid }}

  integration:
    name: Integration tests (browsers, network)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build -c Release
      - name: Install Playwright browsers
        run: pwsh LumenHut.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps
      - run: dotnet test --no-build -c Release --filter "Category=Integration"
